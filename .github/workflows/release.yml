name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p dist/tobs_blaine
          cp -r tobs_blaine/. LICENSE dist/tobs_blaine/
          cd dist && zip -r "tobs_blaine-esx-${GITHUB_REF_NAME}.zip" tobs_blaine

      - name: Release notes from CHANGELOG.md
        run: python3 .github/release_notes.py "${GITHUB_REF_NAME}" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: tobs_blaine ${{ github.ref_name }} (ESX)
          body_path: notes.md
          files: dist/*.zip
